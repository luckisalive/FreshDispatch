<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fd-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003fb3" />
      <stop offset="100%" stop-color="#1f54d3" />
    </linearGradient>
    <linearGradient id="check-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a86b" />
      <stop offset="100%" stop-color="#006c48" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Base Rounded Badge -->
  <rect width="64" height="64" rx="16" fill="url(#fd-grad)" />

  <!-- Newspaper / Document Card -->
  <g filter="url(#shadow)">
    <rect x="13" y="12" width="30" height="40" rx="3" fill="#ffffff" />
    <rect x="18" y="18" width="20" height="3.5" rx="1" fill="#003fb3" />
    <rect x="18" y="25" width="14" height="2" rx="1" fill="#747686" />
    <rect x="18" y="30" width="18" height="2" rx="1" fill="#c3c5d7" />
    <rect x="18" y="35" width="16" height="2" rx="1" fill="#c3c5d7" />
    <rect x="18" y="40" width="12" height="2" rx="1" fill="#c3c5d7" />
  </g>

  <!-- Verification Check Badge -->
  <circle cx="43" cy="41" r="13" fill="url(#check-grad)" stroke="#ffffff" stroke-width="2.5" />
  <path d="M37.5 41 L41 44.5 L48.5 37" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>